<svg xmlns="http://www.w3.org/2000/svg"
     width="512" height="512" viewBox="0 0 512 512"
     role="img" aria-label="Lancée live chat — click to start a conversation">
  <defs>
    <!-- Brand gradient, matched to the Lancée mark: warm orange/coral at top,
         through magenta and purple, to blue/cyan at the base -->
    <linearGradient id="brandGradient" x1="12%" y1="0%" x2="88%" y2="100%">
      <stop offset="0%"   stop-color="#FF9B6B"/>
      <stop offset="20%"  stop-color="#FF7D8A"/>
      <stop offset="42%"  stop-color="#E4549C"/>
      <stop offset="62%"  stop-color="#7A4FD9"/>
      <stop offset="80%"  stop-color="#4F7BE8"/>
      <stop offset="100%" stop-color="#4EB1F6"/>
    </linearGradient>

    <radialGradient id="glossHighlight" cx="34%" cy="22%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="groundShadow" cx="50%" cy="88%" r="60%">
      <stop offset="0%" stop-color="#3A1650" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#3A1650" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="waveStroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFE3D2" stop-opacity="0.0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#CFE9FF" stop-opacity="0.0"/>
    </linearGradient>

    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="ringGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>

    <filter id="markShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#2A1140" flood-opacity="0.28"/>
    </filter>

    <clipPath id="bodyClip">
      <circle cx="256" cy="238" r="190"/>
    </clipPath>
  </defs>

  <style>
    @media (prefers-reduced-motion: reduce) {
      #pulseRings, #breathe animate, #waveband animate, #waveband animateTransform, #markSpin animateTransform { display: none; }
    }
  </style>

  <!-- soft grounding shadow -->
  <ellipse cx="256" cy="330" rx="176" ry="70" fill="url(#groundShadow)"/>

  <!-- attention rings: the "there's someone here" signal -->
  <g id="pulseRings" stroke="#FFFFFF" fill="none" filter="url(#ringGlow)">
    <circle cx="256" cy="238" r="190" stroke-width="5" opacity="0">
      <animate attributeName="r" values="190;190;238" keyTimes="0;0.5;1" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.5;0" keyTimes="0;0.5;1" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="256" cy="238" r="190" stroke-width="5" opacity="0">
      <animate attributeName="r" values="190;190;238" keyTimes="0;0.5;1" dur="3.2s" begin="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.5;0" keyTimes="0;0.5;1" dur="3.2s" begin="1.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- main body: slow breathing scale, pivoting around the orb's own center -->
  <g id="breathe" transform="translate(256,238)">
    <g>
      <animateTransform attributeName="transform" type="scale"
        values="1;1.028;1" keyTimes="0;0.5;1" dur="4s" repeatCount="indefinite"
        calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/>
      <g transform="translate(-256,-238)">

        <!-- speech-bubble tail, fused into the lower-left of the body -->
        <path d="M150 372
                 C132 402, 102 428, 76 456
                 C70 462, 74 470, 82 470
                 C112 468, 140 456, 164 438
                 C176 428, 184 412, 186 396
                 C186 386, 178 376, 166 372
                 C161 370, 155 370, 150 372 Z"
              fill="url(#brandGradient)"/>

        <!-- orb body -->
        <circle cx="256" cy="238" r="190" fill="url(#brandGradient)"/>

        <g clip-path="url(#bodyClip)">
          <ellipse cx="256" cy="238" rx="190" ry="190" fill="url(#glossHighlight)"/>

          <!-- faint flowing texture, echoing the original animation -->
          <g id="waveband" fill="none" stroke="url(#waveStroke)" stroke-width="1.4"
             stroke-linecap="round" opacity="0.5">
            <animateTransform attributeName="transform" type="translate"
              values="-12 0; 12 0; -12 0" dur="5s" repeatCount="indefinite"/>
            <path d="M40 300 C130 250 175 235 250 270 C325 305 375 340 472 288"/>
            <path d="M40 314 C133 268 178 248 253 283 C327 318 379 349 472 302"/>
            <path d="M40 328 C136 286 181 261 256 296 C329 331 383 358 472 316"/>
          </g>
        </g>

        <!-- Lancée mark, traced from the brand logo -->
        <g transform="translate(129.7,130.3) scale(0.6)" filter="url(#markShadow)">
          <!-- brief logo spin every 2.8s; it rests most of the cycle so the widget stays calm -->
          <g id="markSpin">
            <animateTransform attributeName="transform" type="rotate"
              values="0 189 189;0 189 189;360 189 189;360 189 189"
              keyTimes="0;0.78;0.96;1" dur="2.8s" repeatCount="indefinite"
              calcMode="spline" keySplines="0 0 1 1;0.4 0 0.2 1;0 0 1 1"/>
            <g fill="#FFFFFF" fill-opacity="0.96">
              <path transform="translate(0,378) scale(0.1,-0.1)" d="M1709 3409 c-259 -21 -460 -108 -626 -269 -118 -116 -186 -231 -235
              -400 -17 -58 -16 -1953 1 -2016 15 -56 63 -109 129 -141 l57 -28 750 -3 c849
              -3 833 -4 992 73 110 54 214 149 291 267 72 111 302 572 302 606 0 15 -5 33
              -12 40 -18 18 -1438 16 -1490 -2 -21 -8 -38 -12 -38 -9 0 2 8 20 19 41 10 20
              22 51 26 67 5 17 7 417 6 890 -2 856 -2 860 -23 878 -11 9 -28 16 -37 16 -9
              -1 -59 -5 -112 -10z"/>
            </g>
          </g>
        </g>

      </g>
    </g>
  </g>

  <!-- unread indicator badge — toggle via CSS/JS to match real message state -->
  <g id="unreadBadge">
    <circle cx="400" cy="92" r="28" fill="#FF3B4E" stroke="#FFFFFF" stroke-width="6"/>
  </g>
</svg>
