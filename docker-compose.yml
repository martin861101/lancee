services:
  app:
    build: .
    ports:
      - "5177:5177"
    environment:
      - NODE_ENV=production
      - APP_ENV=production
      - PGHOST=db
      - PGPORT=5432
      - PGUSER=${POSTGRES_USER:-lancee}
      - PGPASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - PGDATABASE=${POSTGRES_DB:-lancee_app}
      - DATABASE_PATH=
    env_file:
      - .env
    volumes:
      - .runtime:/app/.runtime
      - ${CODEX_WORKSPACE_PATH:-.}:/workspace
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lancee}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-lancee_app}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lancee} -d ${POSTGRES_DB:-lancee_app}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
