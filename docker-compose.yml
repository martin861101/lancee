services:
  app:
    build: .
    ports:
      - "5177:5177"
    environment:
      - NODE_ENV=production
      - APP_ENV=production
      - PGHOST=db
      - PGPORT=5432
      - PGUSER=${POSTGRES_USER:-lancee}
      - PGPASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - PGDATABASE=${POSTGRES_DB:-lancee_app}
      - DATABASE_PATH=
      - ALLOW_REGISTRATION=true
      - REDIS_URL=redis://redis:6379
      - OPENCONNECTOR_ENABLED=${OPENCONNECTOR_ENABLED:-false}
      - OPENCONNECTOR_URL=http://openconnector:3000
      - OPENCONNECTOR_RUNTIME_TOKEN=${OPENCONNECTOR_RUNTIME_TOKEN:-}
      - OPENCONNECTOR_ADMIN_TOKEN=${OPENCONNECTOR_ADMIN_TOKEN:-}
    env_file:
      - .env
    volumes:
      - .runtime:/app/.runtime
      - ${CODEX_WORKSPACE_PATH:-.}:/workspace
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  openconnector:
    image: ghcr.io/oomol-lab/open-connector:v1.3.5
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      OOMOL_CONNECT_DATA_DIR: /app/data
      OOMOL_CONNECT_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:5177}/openconnector
      OOMOL_CONNECT_ENCRYPTION_KEY: ${OPENCONNECTOR_ENCRYPTION_KEY:-}
      OOMOL_CONNECT_ADMIN_TOKEN: ${OPENCONNECTOR_ADMIN_TOKEN:-}
      OOMOL_CONNECT_RUNTIME_TOKEN: ${OPENCONNECTOR_RUNTIME_TOKEN:-}
      OOMOL_CONNECT_ALLOWED_ACTIONS: ${OPENCONNECTOR_ALLOWED_ACTIONS:-}
      OOMOL_CONNECT_BLOCKED_ACTIONS: ${OPENCONNECTOR_BLOCKED_ACTIONS:-}
      OOMOL_CONNECT_ALLOWED_PROXIES: ""
      OOMOL_CONNECT_BLOCKED_PROXIES: "*"
    volumes:
      - openconnector_data:/app/data
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lancee}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-lancee_app}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lancee} -d ${POSTGRES_DB:-lancee_app}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - core_redis:/data
    restart: unless-stopped

volumes:
  pgdata:
  core_redis:
  openconnector_data:
