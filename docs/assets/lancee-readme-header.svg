        <rect width="112" height="35" rx="17.5" fill="#67e8f9"/>
        <text x="56" y="23" text-anchor="middle" fill="#082f49" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">CLIENTS</text>
        <rect x="124" width="126" height="35" rx="17.5" fill="#818cf8" fill-opacity="0.2" stroke="#a5b4fc" stroke-opacity="0.4"/>
        <text x="187" y="23" text-anchor="middle" fill="#e0e7ff" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">AUTOMATIONS</text>
        <rect x="262" width="98" height="35" rx="17.5" fill="#fbbf24" fill-opacity="0.16" stroke="#fde68a" stroke-opacity="0.4"/>
        <text x="311" y="23" text-anchor="middle" fill="#fef3c7" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">PAYMENTS</text>
