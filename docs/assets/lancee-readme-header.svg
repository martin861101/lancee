      <circle cx="43" cy="43" r="5" fill="#fb7185"/>
      <circle cx="61" cy="43" r="5" fill="#fbbf24"/>
      <circle cx="79" cy="43" r="5" fill="#34d399"/>
      <rect x="112" y="35" width="128" height="16" rx="8" fill="#e0e7ff" fill-opacity="0.13"/>
