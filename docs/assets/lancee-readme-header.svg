      <text y="236" fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="52" font-weight="650" letter-spacing="-2.2">Keep the work moving.</text>
      <text y="278" fill="#bfdbfe" fill-opacity="0.82" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="21" font-weight="450">Projects, ideas, automations, and payments</text>
      <text y="309" fill="#bfdbfe" fill-opacity="0.82" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="21" font-weight="450">in one focused workspace.</text>

