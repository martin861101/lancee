<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">lancee — keep the work moving</title>
  <desc id="desc">A dark navy abstract workspace dashboard with the lancee wordmark and colorful workflow cards.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080d1c"/>
      <stop offset="0.52" stop-color="#101a35"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="0.52" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fb7185"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <radialGradient id="cyan-glow" cx="0.12" cy="0.2" r="0.7">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violet-glow" cx="0.85" cy="0.8" r="0.7">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#dbeafe" stroke-opacity="0.08"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#020617" flood-opacity="0.48"/>
    </filter>
    <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
    <clipPath id="header-clip">
      <rect width="1600" height="520" rx="30"/>
    </clipPath>
  </defs>

  <g clip-path="url(#header-clip)">
    <rect width="1600" height="520" fill="url(#background)"/>
    <rect width="1600" height="520" fill="url(#cyan-glow)"/>
    <rect width="1600" height="520" fill="url(#violet-glow)"/>
    <rect width="1600" height="520" fill="url(#grid)"/>

    <circle cx="1410" cy="-30" r="280" fill="none" stroke="#93c5fd" stroke-opacity="0.14" stroke-width="2"/>
    <circle cx="1410" cy="-30" r="220" fill="none" stroke="#c4b5fd" stroke-opacity="0.13" stroke-width="2"/>
    <circle cx="1410" cy="-30" r="160" fill="none" stroke="#67e8f9" stroke-opacity="0.12" stroke-width="2"/>
    <path d="M0 425C244 348 424 471 650 402C818 350 854 262 1050 283C1246 304 1318 420 1600 363" fill="none" stroke="#e0e7ff" stroke-opacity="0.1" stroke-width="2"/>

    <g transform="translate(92 82)">
      <rect width="66" height="66" rx="19" fill="url(#accent)" filter="url(#soft-shadow)"/>
      <path d="M21 16h15v28h18v10H21V16Z" fill="#07111f"/>
      <path d="M21 16h15v10H21z" fill="#ecfeff" fill-opacity="0.9"/>

      <text x="90" y="60" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="86" font-weight="700" letter-spacing="-4">lancee</text>
      <circle cx="394" cy="52" r="7" fill="#67e8f9"/>

      <rect y="126" width="334" height="32" rx="16" fill="#e0e7ff" fill-opacity="0.09" stroke="#bfdbfe" stroke-opacity="0.2"/>
      <circle cx="18" cy="142" r="4" fill="#67e8f9"/>
