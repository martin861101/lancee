      <circle cx="59" cy="311" r="6" fill="#67e8f9"/>
      <rect x="72" y="306" width="46" height="9" rx="4.5" fill="#e0e7ff" fill-opacity="0.65"/>

      <rect x="185" y="86" width="361" height="116" rx="16" fill="#111d37" stroke="#bfdbfe" stroke-opacity="0.1"/>
      <text x="207" y="119" fill="#cbd5e1" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">WORKSPACE PULSE</text>
