      <circle cx="28" cy="27" r="9" fill="url(#warm)"/>
      <path d="M24 27h9M28.5 22.5v9" stroke="#fff7ed" stroke-width="2" stroke-linecap="round"/>
      <text x="49" y="33" fill="#172554" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">one calm place</text>
