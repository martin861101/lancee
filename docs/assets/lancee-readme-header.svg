      <circle cx="527" cy="115" r="17" fill="#34d399" fill-opacity="0.16"/>
      <path d="m520 115 5 5 10-12" fill="none" stroke="#6ee7b7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

