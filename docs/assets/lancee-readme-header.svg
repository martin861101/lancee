      <rect x="256" y="267" width="13" height="59" rx="6.5" fill="#c084fc"/>
      <rect x="280" y="286" width="13" height="40" rx="6.5" fill="#fbbf24"/>
      <rect x="304" y="275" width="13" height="51" rx="6.5" fill="#67e8f9" fill-opacity="0.5"/>
      <path d="M202 335h124" stroke="#cbd5e1" stroke-opacity="0.14"/>

      <rect x="380" y="222" width="166" height="134" rx="16" fill="#111d37" stroke="#bfdbfe" stroke-opacity="0.1"/>
      <text x="402" y="252" fill="#cbd5e1" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">NEXT UP</text>
      <circle cx="410" cy="285" r="8" fill="#fb7185" fill-opacity="0.85"/>
      <rect x="430" y="278" width="86" height="10" rx="5" fill="#e0e7ff" fill-opacity="0.7"/>
      <rect x="430" y="297" width="61" height="8" rx="4" fill="#e0e7ff" fill-opacity="0.18"/>
      <circle cx="410" cy="327" r="8" fill="#67e8f9" fill-opacity="0.85"/>
